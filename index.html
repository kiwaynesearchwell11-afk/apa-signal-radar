<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.P.A. M15 ELITE - Institutional Confluence Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #070a10;
      color: #e2e8f0;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 90px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { font-size: 1.25rem; letter-spacing: 1px; color: #ffffff; font-weight: 800; }
    
    .bot-badge { background: #0d231e; color: #38ef7d; border: 1px solid #164e3b; font-size: 0.68rem; font-weight: 700; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 6px; height: 6px; background-color: #38ef7d; border-radius: 50%; animation: pulse 2s infinite; }
    .dot.offline { background-color: #f43f5e; box-shadow: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(56, 239, 125, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0); }
    }

    .notify-btn {
      background: #0f172a;
      color: #38ef7d;
      border: 1px solid #1e293b;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      width: 100%;
      margin-bottom: 12px;
      cursor: pointer;
      text-align: center;
    }

    .tf-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tf-box .title { font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
    .tf-box .timer { font-family: monospace; font-size: 1.1rem; font-weight: 800; color: #38ef7d; }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn {
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active { background: #134e4a; color: #38ef7d; border-color: #0d9488; }

    .radar-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 480px; overflow-y: auto; padding-right: 4px; }
    .radar-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; transition: all 0.3s ease; }
    .radar-card.ready-buy { border-color: #059669; background: #061e18; }
    .radar-card.ready-sell { border-color: #e11d48; background: #230e14; }

    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .asset-name { font-size: 0.85rem; font-weight: 700; color: #ffffff; }
    
    .badges-group { display: flex; gap: 6px; align-items: center; }
    .badge { font-size: 0.62rem; font-weight: 800; padding: 3px 7px; border-radius: 4px; }
    .badge-buy { background: rgba(56, 239, 125, 0.2); color: #38ef7d; }
    .badge-sell { background: rgba(244, 63, 94, 0.2); color: #f43f5e; }
    .badge-wait { background: rgba(100, 116, 139, 0.15); color: #94a3b8; }
    .badge-score { background: #1e293b; color: #fbbf24; border: 1px solid #334155; }

    .metrics-row { display: flex; justify-content: space-between; font-size: 0.68rem; color: #94a3b8; font-family: monospace; background: #0b1019; padding: 6px 10px; border-radius: 6px; }
    .levels-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.68rem; color: #e2e8f0; font-weight: 700; background: #0b1019; padding: 6px 10px; border-radius: 6px; }
    
    .chart-link {
      background: #1e293b;
      color: #38ef7d;
      border: 1px solid #334155;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>A.P.A. M15 ELITE</h1>
    <div class="bot-badge"><div class="dot" id="ws-dot"></div> <span id="ws-status">INITIALIZING...</span></div>
  </div>

  <button class="notify-btn" id="notify-btn" onclick="requestNotificationPermission()">
    🔔 ENABLE AUDIO & PUSH ALERTS
  </button>

  <div class="tf-box">
    <div>
      <div class="title">M15 Candle Close Countdown</div>
      <div style="font-size: 0.62rem; color: #64748b;">Multi-Timeframe Confluence Active</div>
    </div>
    <div class="timer" id="m15-timer">15:00</div>
  </div>

  <div class="filter-tabs">
    <button class="tab-btn active" onclick="setFilter('ALL', this)">All Markets (14)</button>
    <button class="tab-btn" onclick="setFilter('STD', this)">Standard Vol</button>
    <button class="tab-btn" onclick="setFilter('1S', this)">1-Second Vol</button>
    <button class="tab-btn" onclick="setFilter('ELITE', this)">Step & Jump</button>
  </div>

  <div class="radar-list" id="m15-radar"></div>

  <script>
    const TELEGRAM_BOT_TOKEN = "8212576128:AAEF9EGR9R3FMUjon8Ls4c9GltMw2MB4SvM";
    const TELEGRAM_CHAT_ID = "5913949259";

    let currentFilter = 'ALL';
    let timeLeft = 900; 

    const MARKETS = [
      { symbol: "R_10", name: "Volatility 10 Index", group: "STD", digits: 2, atr: 1.5 },
      { symbol: "R_25", name: "Volatility 25 Index", group: "STD", digits: 2, atr: 3.0 },
      { symbol: "R_50", name: "Volatility 50 Index", group: "STD", digits: 2, atr: 6.0 },
      { symbol: "R_75", name: "Volatility 75 Index", group: "STD", digits: 2, atr: 10.0 },
      { symbol: "R_100", name: "Volatility 100 Index", group: "STD", digits: 2, atr: 14.0 },
      { symbol: "1HZ10V", name: "Volatility 10 (1s)", group: "1S", digits: 2, atr: 1.2 },
      { symbol: "1HZ25V", name: "Volatility 25 (1s)", group: "1S", digits: 2, atr: 2.5 },
      { symbol: "1HZ50V", name: "Volatility 50 (1s)", group: "1S", digits: 2, atr: 5.5 },
      { symbol: "1HZ75V", name: "Volatility 75 (1s)", group: "1S", digits: 2, atr: 9.0 },
      { symbol: "1HZ100V", name: "Volatility 100 (1s)", group: "1S", digits: 2, atr: 12.5 },
      { symbol: "stpRNG", name: "Step Index", group: "ELITE", digits: 2, atr: 5.0 },
      { symbol: "JD10", name: "Jump 10 Index", group: "ELITE", digits: 2, atr: 15.0 },
      { symbol: "JD50", name: "Jump 50 Index", group: "ELITE", digits: 2, atr: 30.0 },
      { symbol: "JD75", name: "Jump 75 Index", group: "ELITE", digits: 2, atr: 45.0 }
    ];

    const marketState = {};

    MARKETS.forEach(m => {
      marketState[m.symbol] = {
        price: 0,
        rsi: 50,
        score: 50,
        trend: "Neutral",
        type: "WAIT",
        status: "WAITING",
        entry: "0.00",
        tp: "0.00",
        sl: "0.00",
        candles: [],
        lastAlert: 0
      };
    });

    function setFilter(group, btn) {
      currentFilter = group;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderRadar();
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 920;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch(e) {}
    }

    function requestNotificationPermission() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            document.getElementById("notify-btn").innerText = "🔔 PUSH ALERTS ACTIVE";
          }
        });
      }
    }

    function calculateRSI(closes, period = 14) {
      if (closes.length < period + 1) return 50;
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        const change = closes[closes.length - i] - closes[closes.length - i - 1];
        if (change >= 0) gains += change;
        else losses -= change;
      }
      let avgGain = gains / period;
      let avgLoss = losses / period;
      if (avgLoss === 0) return 100;
      let rs = avgGain / avgLoss;
      return Math.round(100 - (100 / (1 + rs)));
    }

    function evaluateEliteMarket(m, candles) {
      if (candles.length < 20) return;

      const currentPrice = candles[candles.length - 1];
      const rsi = calculateRSI(candles, 14);
      
      // Multi-timeframe structure lookback (Comparing 5 candles ago to current)
      const momentumShift = candles[candles.length - 1] - candles[candles.length - 6];
      const macroTrend = candles[candles.length - 1] - candles[candles.length - 15];

      let state = marketState[m.symbol];
      state.price = currentPrice;
      state.rsi = rsi;
      state.entry = currentPrice.toFixed(m.digits);

      let score = 50;
      if (rsi < 40) score += 20;
      if (rsi > 60) score += 20;
      if (macroTrend > 0) score += 15;
      else score -= 15;
      state.score = Math.min(Math.max(score, 10), 98);

      state.trend = macroTrend > 0 ? "Bullish Bias" : "Bearish Bias";

      // Strict Execution Rules
      if (rsi <= 38 && momentumShift > 0 && macroTrend > -5) {
        state.type = "BUY";
        state.status = "READY";
        state.tp = (currentPrice + (m.atr * 2.8)).toFixed(m.digits);
        state.sl = (currentPrice - (m.atr * 1.4)).toFixed(m.digits);
      } else if (rsi >= 62 && momentumShift < 0 && macroTrend < 5) {
        state.type = "SELL";
        state.status = "READY";
        state.tp = (currentPrice - (m.atr * 2.8)).toFixed(m.digits);
        state.sl = (currentPrice + (m.atr * 1.4)).toFixed(m.digits);
      } else {
        state.type = "WAIT";
        state.status = "WAITING";
        state.tp = "—";
        state.sl = "—";
      }

      // Fire Alerts on Elite Setup Confirmation
      if (state.status === "READY" && state.score >= 70 && (Date.now() - state.lastAlert > 60000)) {
        state.lastAlert = Date.now();
        playBeep();
        if (Notification.permission === "granted") {
          new Notification(`🔥 M15 ELITE [${state.type}]: ${m.name}`, { body: `Score: ${state.score}% | Entry: ${state.entry}` });
        }
        if (TELEGRAM_BOT_TOKEN && TELEGRAM_CHAT_ID) {
          const emoji = state.type === "BUY" ? "🟢" : "🔴";
          const msg = `🚀 *A.P.A. M15 ELITE SIGNAL* ${emoji}\n` +
                      `📊 Asset: \`${m.symbol}\` (${m.name})\n` +
                      `⚡ Action: *EXECUTE ${state.type}*\n` +
                      `🌟 Confidence Score: *${state.score}%*\n` +
                      `💵 Entry Price: \`${state.entry}\`\n` +
                      `🎯 TP: \`${state.tp}\` | 🛑 SL: \`${state.sl}\`\n` +
                      `📈 RSI: ${rsi} | Trend: ${state.trend}`;
          fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`).catch(()=>{});
        }
      }
    }

    function renderRadar() {
      const container = document.getElementById("m15-radar");
      container.innerHTML = MARKETS.filter(m => currentFilter === 'ALL' || m.group === currentFilter).map(m => {
        let state = marketState[m.symbol];
        let cardClass = state.status === "READY" ? (state.type === "BUY" ? "ready-buy" : "ready-sell") : "";
        let badgeClass = state.type === "BUY" ? "badge-buy" : (state.type === "SELL" ? "badge-sell" : "badge-wait");
        
        return `
          <div class="radar-card ${cardClass}">
            <div class="card-top">
              <span class="asset-name">${m.name}</span>
              <div class="badges-group">
                <span class="badge badge-score">${state.score}% Score</span>
                <span class="badge ${badgeClass}">M15 ${state.type}</span>
              </div>
            </div>
            <div class="metrics-row">
              <span>RSI: ${state.rsi}</span>
              <span>Structure: ${state.trend}</span>
            </div>
            <div class="levels-row">
              <span>Entry: ${state.entry}</span>
              <span>TP: ${state.tp}</span>
              <span>SL: ${state.sl}</span>
              <a href="metatrader5://trade?symbol=${m.symbol}" class="chart-link">MT5</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateTimer() {
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      document.getElementById("m15-timer").innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
      if (timeLeft > 0) {
        timeLeft--;
      } else {
        timeLeft = 900; 
      }
    }

    function connectDerivWebSocket() {
      const ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

      ws.onopen = () => {
        document.getElementById("ws-dot").className = "dot";
        document.getElementById("ws-status").innerText = "ELITE WS CONNECTED";
        
        MARKETS.forEach(m => {
          ws.send(JSON.stringify({
            ticks_history: m.symbol,
            adjust_start_time: 1,
            count: 35,
            end: "latest",
            granularity: 900,
            style: "candles"
          }));
          ws.send(JSON.stringify({ ticks: m.symbol, subscribe: 1 }));
        });
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.msg_type === "candles" && data.candles) {
          const symbol = data.echo_req.ticks_history;
          if (marketState[symbol]) {
            marketState[symbol].candles = data.candles.map(c => c.close);
            const mObj = MARKETS.find(x => x.symbol === symbol);
            if (mObj) evaluateEliteMarket(mObj, marketState[symbol].candles);
            renderRadar();
          }
        }
        if (data.msg_type === "tick" && data.tick) {
          const symbol = data.tick.symbol;
          const price = data.tick.quote;
          if (marketState[symbol]) {
            marketState[symbol].price = price;
            if (marketState[symbol].candles.length > 0) {
              marketState[symbol].candles[marketState[symbol].candles.length - 1] = price;
            }
            const mObj = MARKETS.find(x => x.symbol === symbol);
            if (mObj) evaluateEliteMarket(mObj, marketState[symbol].candles);
            renderRadar();
          }
        }
      };

      ws.onerror = () => {
        document.getElementById("ws-dot").className = "dot offline";
        document.getElementById("ws-status").innerText = "WS ERROR";
      };

      ws.onclose = () => {
        document.getElementById("ws-dot").className = "dot offline";
        document.getElementById("ws-status").innerText = "RECONNECTING...";
        setTimeout(connectDerivWebSocket, 3000);
      };
    }

    renderRadar();
    connectDerivWebSocket();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
