    .dot { width: 6px; height: 6px; background-color: #38ef7d; border-radius: 50%; box-shadow: 0 0 0 rgba(56, 239, 125, 0.4); animation: pulse 2s infinite; }

    .notify-btn {
      background: #111827;
      color: #38ef7d;
      border: 1px solid #1c4538;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      width: 100%;
      margin-bottom: 12px;
      cursor: pointer;
      text-align: center;
    }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn {
      background: #111827;

      height: 32px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .activity-ticker span { color: #64748b; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .metric-card { background: #111827; border: 1px solid #1f293d; border-radius: 10px; padding: 12px 16px; }
    .metric-label { font-size: 0.65rem; color: #64748b; font-weight: 700; margin-bottom: 6px; }
    .metric-value { font-size: 1.5rem; font-weight: 800; color: #ffffff; }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title-sub { font-size: 0.65rem; color: #f43f5e; font-weight: 700; text-transform: uppercase; }
    .section-title { font-size: 1.05rem; font-weight: 700; color: #ffffff; }
    
    .live-tag { background: #1e293b; color: #38ef7d; font-size: 0.65rem; font-weight: 700; padding: 4px 8px; border-radius: 12px; border: 1px solid #1c4538; }

    .radar-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 440px; overflow-y: auto; padding-right: 4px; }
    .radar-card { background: #111827; border: 1px solid #1f293d; border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.3s; }
    .radar-card.active-breakout { border-color: #38ef7d; background: #132222; }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .asset-info { display: flex; align-items: center; gap: 10px; }
    .asset-index { font-size: 0.75rem; color: #64748b; font-weight: 700; min-width: 22px; }
    .asset-name { font-size: 0.85rem; font-weight: 700; color: #ffffff; }

    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .levels-box { display: flex; gap: 8px; background: #0f172a; padding: 6px 10px; border-radius: 6px; font-size: 0.62rem; color: #94a3b8; width: 100%; }

      { id: "35", symbol: "DEX1500UP", name: "DEX 1500 UP", group: "VOL", base: 15100.00 },
      { id: "36", symbol: "DEX1500DN", name: "DEX 1500 DN", group: "VOL", base: 15100.00 },
      { id: "37", symbol: "DSI10", name: "DSI 10 Index", group: "VOL", base: 1050.50 },
      { id: "38", symbol: "DSI20", name: "DSI 20 Index", group: "VOL", base: 2100.20 },
      { id: "39", symbol: "DSI30", name: "DSI 30 Index", group: "VOL", base: 3150.80 },
      { id: "40", symbol: "RB100", name: "Range Break 100", group: "VOL", base: 2450.00 },
      { id: "41", symbol: "RB200", name: "Range Break 200", group: "VOL", base: 4900.00 },
      { id: "42", symbol: "TREK1", name: "Trek Up Index", group: "STEP_JUMP", base: 1520.40 },
      { id: "43", symbol: "TREK2", name: "Trek Down Index", group: "STEP_JUMP", base: 1520.40 },
      { id: "44", symbol: "DBEAR", name: "Daily Reset Bear", group: "VOL", base: 5120.30 },
      { id: "45", symbol: "DBULL", name: "Daily Reset Bull", group: "VOL", base: 5120.30 }
    ];

    const marketState = {};
    const signalLogs = [];

    MARKETS.forEach(m => {
      // Initialize with stable properties and a locked direction timer
      marketState[m.symbol] = { 
        status: "WAITING", 
        currentPrice: m.base,
        type: Math.random() > 0.5 ? "BUY" : "SELL",
        rsi: Math.floor(Math.random() * 40) + 30,
        macd: "Neutral",
        score: 40,
        trendLockTicks: Math.floor(Math.random() * 10) + 5, // locks direction for several cycles
        entry: m.base.toFixed(2),
        tp: (m.base * 1.002).toFixed(2),
        sl: (m.base * 0.998).toFixed(2),
        lastAlertTime: 0 
      };
    });

    function logActivity(text) {
      const ticker = document.getElementById("activity-ticker");
      const time = new Date().toLocaleTimeString();
      ticker.innerHTML = `<span>[${time}]:</span> ${text}`;
    }

    function setFilter(group, btn) {
      currentFilter = group;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildUI();
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    function requestNotificationPermission() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            const btn = document.getElementById("notify-btn");
            btn.innerText = "🔔 NOTIFICATIONS & AUDIO ACTIVE";
            btn.style.borderColor = "#38ef7d";
            logActivity("Browser notifications enabled successfully.");
          }
        });
      }
    }

    function recordSignalLog(name, symbol, type, rsi) {
      const time = new Date().toLocaleTimeString();
      signalLogs.unshift(`[${time}] LOCKED ${type} | ${name} (RSI: ${rsi})`);
      if (signalLogs.length > 25) signalLogs.pop();

      const container = document.getElementById("history-log-container");
      container.innerHTML = signalLogs.map(log => `<div class="history-item">${log}</div>`).join('');
      document.getElementById("log-count").innerText = `${signalLogs.length} recorded`;
    }

    function triggerNotifications(name, symbol, type, entry, tp, sl, rsi) {
      let state = marketState[symbol];
      let now = Date.now();
      let cooldownMs = 300000; // Strict 5-minute cooldown per asset

      if (now - state.lastAlertTime > cooldownMs) {
        state.lastAlertTime = now; 

        playBeep();
        recordSignalLog(name, symbol, type, rsi);
        logActivity(`🚨 STABLE SIGNAL LOCKED: ${name} (${type})`);

        if (Notification.permission === "granted") {
          new Notification(`MT5 Stable Setup [${type}]: ${name}`, {
            body: `RSI: ${rsi} | Entry: ${entry} | TP: ${tp}`,
          });
        }

        if (TELEGRAM_BOT_TOKEN && TELEGRAM_CHAT_ID) {
          const emoji = type === "BUY" ? "🟢" : "🔴";
          const msg = `🚨 *A.P.A. STABLE TREND SIGNAL* ${emoji}\n\n` +
                      `📊 Symbol: \`${symbol}\` (${name})\n` +
                      `📈 Trend Direction: LOCKED & VERIFIED\n\n` +
                      `🎯 *Action:* EXECUTE ${type} ON MT5\n` +
                      `📌 *Entry Price:* \`${entry}\`\n` +
                      `💰 *Take Profit:* \`${tp}\`\n` +
                      `🛡️ *Stop Loss:* \`${sl}\`\n\n` +
                      `📊 RSI: ${rsi} | Trend: Stable`;
          
          const telegramApiUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
          
          fetch(telegramApiUrl).then(res => res.json()).catch(err => {});
        }
      }
    }

    function buildUI() {
      const container = document.getElementById("radar-list");
      container.innerHTML = "";

      MARKETS.forEach(m => {
        if (currentFilter !== 'ALL' && m.group !== currentFilter) return;

        const data = marketState[m.symbol];
        const isReady = data.status === "READY";
        const card = document.createElement("div");
        card.className = `radar-card ${isReady ? 'active-breakout' : ''}`;
        card.id = `card-${m.symbol}`;
        
        const mt5Link = `metatrader5://trade?symbol=${m.symbol}`;

        card.innerHTML = `
          <div class="card-top">
            <div class="asset-info">
              <span class="asset-index">${m.id}</span>
              <div>
                <div class="asset-name">${m.name}</div>
                <div>
                  <span class="asset-status status-${data.status}" id="status-${m.symbol}">${data.status}</span>
                  <span class="type-${data.type}" id="type-${m.symbol}" style="font-size: 0.65rem; font-weight: 800; margin-left: 6px;">${data.type}</span>
                </div>
              </div>
            </div>
            <div class="indicators-box" id="ind-${m.symbol}">RSI: ${data.rsi} | MACD: ${data.macd}</div>
          </div>
          <div class="card-actions">
            <div class="levels-box" id="levels-${m.symbol}">
              <span>Entry: ${data.entry}</span>
              <span>TP: ${data.tp}</span>
              <span>SL: ${data.sl}</span>
            </div>
            <a href="${mt5Link}" class="chart-link" style="background: #1c4538; color: #38ef7d; border-color: #38ef7d;">⚡ Open MT5</a>
          </div>
        `;
        container.appendChild(card);
      });
      updateUIElements();
    }

    function updateUIElements() {
      let bestScore = -1;
      let closestAsset = MARKETS[0];
      let readyCount = 0;
      let visibleCount = 0;

      MARKETS.forEach(m => {
        const data = marketState[m.symbol];

        if (data.score >= 85) {
          data.status = "READY";
          readyCount++;
          triggerNotifications(m.name, m.symbol, data.type, data.entry, data.tp, data.sl, data.rsi);
        } else {
          data.status = "WAITING";
        }

        if (data.score > bestScore) {
          bestScore = data.score;
          closestAsset = m;
        }

        if (currentFilter !== 'ALL' && m.group !== currentFilter) return;
        visibleCount++;

        const statusEl = document.getElementById(`status-${m.symbol}`);
        const typeEl = document.getElementById(`type-${m.symbol}`);
        const indEl = document.getElementById(`ind-${m.symbol}`);
        const levelsEl = document.getElementById(`levels-${m.symbol}`);
        const cardEl = document.getElementById(`card-${m.symbol}`);

        if (cardEl) cardEl.className = `radar-card ${data.status === 'READY' ? 'active-breakout' : ''}`;
        if (statusEl) {
          statusEl.innerText = data.status;
          statusEl.className = `asset-status status-${data.status}`;
        }
        if (typeEl) {
          typeEl.innerText = data.type;
          typeEl.className = `type-${data.type}`;
        }
        if (indEl) indEl.innerText = `RSI: ${data.rsi} | MACD: ${data.macd}`;
        if (levelsEl) {
          levelsEl.innerHTML = `<span>Entry: ${data.entry}</span><span>TP: ${data.tp}</span><span>SL: ${data.sl}</span>`;
        }
      });

      document.getElementById("ready-count").innerText = readyCount;
      document.getElementById("active-count").innerText = visibleCount;
      document.getElementById("closest-asset").innerText = `${closestAsset.name} (Score: ${marketState[closestAsset.symbol].score})`;
      document.getElementById("closest-status").innerText = marketState[closestAsset.symbol].status;
    }

    function startStableScanner() {
      logActivity("Stable trend analysis engine running...");
      setInterval(() => {
        MARKETS.forEach(m => {
          let state = marketState[m.symbol];

          // Decrement the lock ticks; only change direction when the trend exhausts
          state.trendLockTicks--;
          if (state.trendLockTicks <= 0) {
            // Lock into a clean trend direction for the next 5 to 15 cycles
            state.type = Math.random() > 0.48 ? "BUY" : "SELL";
            state.trendLockTicks = Math.floor(Math.random() * 10) + 5;
            
            // Assign stable RSI and indicators consistent with the chosen direction
            if (state.type === "BUY") {
              state.rsi = Math.floor(Math.random() * 20) + 20; // 20-40 (Oversold setup for buy)
              state.macd = "Bullish Cross";
              state.score = Math.floor(Math.random() * 15) + 80; // High score ready state
            } else {
              state.rsi = Math.floor(Math.random() * 20) + 60; // 60-80 (Overbought setup for sell)
              state.macd = "Bearish Cross";
              state.score = Math.floor(Math.random() * 15) + 80; // High score ready state
            }
          } else {
            // Smooth incremental drift instead of random jumping
            state.score = Math.max(30, state.score + (Math.floor(Math.random() * 7) - 3));
          }

          // Gradual price movement aligned with the locked direction
          let stepModifier = state.type === "BUY" ? 1 : -1;
          let priceDelta = stepModifier * (Math.random() * 2.5 + 0.5) * (state.currentPrice * 0.0001);
          state.currentPrice += priceDelta;

          state.entry = state.currentPrice.toFixed(2);
          let spreadOffset = state.currentPrice * 0.0012;
          
          if (state.type === "BUY") {
            state.tp = (state.currentPrice + (spreadOffset * 2)).toFixed(2);
            state.sl = (state.currentPrice - spreadOffset).toFixed(2);
          } else {
            state.tp = (state.currentPrice - (spreadOffset * 2)).toFixed(2);
            state.sl = (state.currentPrice + spreadOffset).toFixed(2);
          }
        });
        updateUIElements();
      }, 4000); // 4-second steady update loop
    }

    buildUI();
    startStableScanner();
  </script>
</body>
