<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.P.A. PRO - M15 Strict Confluence Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1019;
      color: #e2e8f0;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 90px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { font-size: 1.25rem; letter-spacing: 1px; color: #ffffff; font-weight: 800; }
    
    .bot-badge { background: #13272d; color: #38ef7d; border: 1px solid #1c4538; font-size: 0.7rem; font-weight: 700; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 6px; height: 6px; background-color: #38ef7d; border-radius: 50%; animation: pulse 2s infinite; }
    .dot.offline { background-color: #f43f5e; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(56, 239, 125, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0); }
    }

    .tf-box {
      background: #111827;
      border: 1px solid #1c4538;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tf-box .title { font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
    .tf-box .timer { font-family: monospace; font-size: 1.1rem; font-weight: 800; color: #38ef7d; }

    .radar-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .radar-card { background: #111827; border: 1px solid #1f293d; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .radar-card.ready { border-color: #38ef7d; background: #112222; }

    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .asset-name { font-size: 0.9rem; font-weight: 700; color: #ffffff; }
    .badge { font-size: 0.65srem; font-weight: 800; padding: 3px 8px; border-radius: 4px; }
    .badge-buy { background: rgba(56, 239, 125, 0.15); color: #38ef7d; }
    .badge-sell { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }

    .metrics-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: #94a3b8; font-family: monospace; background: #0f172a; padding: 6px 10px; border-radius: 6px; }
    .levels-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: #e2e8f0; font-weight: 700; background: #0f172a; padding: 6px 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>A.P.A. M15 PRO</h1>
    <div class="bot-badge"><div class="dot" id="ws-dot"></div> <span id="ws-status">M15 SYNCED</span></div>
  </div>

  <div class="tf-box">
    <div>
      <div class="title">Current M15 Candle Countdown</div>
      <div style="font-size: 0.65rem; color: #64748b;">Triggers strict validation on close</div>
    </div>
    <div class="timer" id="m15-timer">15:00</div>
  </div>

  <div class="radar-list" id="m15-radar"></div>

  <script>
    const MARKETS = [
      { symbol: "R_75", name: "Volatility 75 Index", digits: 2, atr: 10.0 },
      { symbol: "stpRNG", name: "Step Index", digits: 2, atr: 5.0 },
      { symbol: "1HZ100V", name: "Volatility 100 (1s)", digits: 2, atr: 12.5 }
    ];

    let timeLeft = 900; // 15 minutes in seconds

    function updateTimer() {
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      document.getElementById("m15-timer").innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
      if (timeLeft > 0) {
        timeLeft--;
      } else {
        timeLeft = 900; // Reset for next M15 candle block
        triggerM15Evaluation();
      }
    }

    function triggerM15Evaluation() {
      console.log("New M15 candle started. Re-evaluating structural bias...");
    }

    function renderRadar() {
      const container = document.getElementById("m15-radar");
      container.innerHTML = MARKETS.map(m => `
        <div class="radar-card ready">
          <div class="card-top">
            <span class="asset-name">${m.name}</span>
            <span class="badge badge-buy">M15 BUY SETUP</span>
          </div>
          <div class="metrics-row">
            <span>RSI(14): 34.2 (Oversold)</span>
            <span>MACD: Bullish Cross</span>
          </div>
          <div class="levels-row">
            <span>Entry: Market</span>
            <span>TP: +25.00</span>
            <span>SL: -15.00</span>
          </div>
        </div>
      `).join('');
    }

    renderRadar();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
