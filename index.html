<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M15 Live Signal Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #060911;
      color: #f1f5f9;
      padding: 12px;
      max-width: 520px;
      margin: 0 auto;
      padding-bottom: 40px;
    }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1322;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #1c273e;
      margin-bottom: 12px;
    }
    .top-bar h1 { font-size: 0.95rem; color: #fff; }

    .status-badge {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      background: #1e293b;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge.online { background: #064e3b; color: #34d399; }
    .status-badge.error { background: #881337; color: #f43f5e; }
    .indicator { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    .cards-wrapper { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: #0d1322;
      border: 1px solid #1c273e;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card.buy { border-color: #10b981; background: #042017; }
    .card.sell { border-color: #f43f5e; background: #260a12; }

    .card-head { display: flex; justify-content: space-between; align-items: center; }
    .symbol-title { font-size: 0.85rem; font-weight: 800; color: #f8fafc; }

    .signal-pill {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .pill-wait { background: #334155; color: #94a3b8; }
    .pill-buy { background: #059669; color: #ecfdf5; }
    .pill-sell { background: #e11d48; color: #fff1f2; }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      background: #060911;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.7rem;
      color: #94a3b8;
    }
    .data-grid b { color: #f1f5f9; }
    .up { color: #34d399 !important; }
    .down { color: #fb7185 !important; }

    .debug-terminal {
      margin-top: 16px;
      background: #020408;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.62rem;
      color: #38ef7d;
      max-height: 100px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>M15 Signal Terminal</h1>
    <div class="status-badge" id="status-tag"><div class="indicator"></div><span id="status-text">OFFLINE</span></div>
  </div>

  <div class="btn-row">
    <button class="btn active" id="btn-reconnect" onclick="reconnect()">Force Reconnect</button>
  </div>

  <div class="cards-wrapper" id="card-container"></div>

  <div class="debug-terminal" id="terminal">System Initialized. Awaiting socket...</div>

  <script>
    const MARKETS = [
      { symbol: "R_10", name: "Volatility 10 Index", digits: 2 },
      { symbol: "R_25", name: "Volatility 25 Index", digits: 2 },
      { symbol: "R_50", name: "Volatility 50 Index", digits: 2 },
      { symbol: "R_75", name: "Volatility 75 Index", digits: 2 },
      { symbol: "R_100", name: "Volatility 100 Index", digits: 2 },
      { symbol: "1HZ10V", name: "Volatility 10 (1s)", digits: 2 },
      { symbol: "1HZ25V", name: "Volatility 25 (1s)", digits: 2 },
      { symbol: "1HZ50V", name: "Volatility 50 (1s)", digits: 2 },
      { symbol: "1HZ75V", name: "Volatility 75 (1s)", digits: 2 },
      { symbol: "1HZ100V", name: "Volatility 100 (1s)", digits: 2 }
    ];

    const state = {};
    let ws = null;
    let ticksReceived = 0;

    MARKETS.forEach(m => {
      state[m.symbol] = {
        price: 0,
        m15ChangePct: "0.00",
        rsi: 50,
        ema50: 0,
        signal: "WAIT",
        ticks: 0,
        candles: []
      };
    });

    function printLog(text) {
      const term = document.getElementById("terminal");
      const time = new Date().toLocaleTimeString();
      term.innerHTML = `[${time}] ${text}<br>` + term.innerHTML;
    }

    function calculateRSI(closes, period = 14) {
      if (closes.length < period + 1) return 50;
      let gains = 0, losses = 0;
      for (let i = 1; i <= period; i++) {
        let diff = closes[closes.length - i] - closes[closes.length - i - 1];
        if (diff >= 0) gains += diff; else losses -= diff;
      }
      let avgGain = gains / period, avgLoss = losses / period;
      if (avgLoss === 0) return 100;
      return Math.round(100 - (100 / (1 + (avgGain / avgLoss))));
    }

    function calculateEMA(closes, period = 50) {
      if (closes.length === 0) return 0;
      let k = 2 / (period + 1), ema = closes[0];
      for (let i = 1; i < closes.length; i++) {
        ema = (closes[i] * k) + (ema * (1 - k));
      }
      return ema;
    }

    function analyze(m, candles) {
      if (!candles || candles.length < 20) return;
      const closes = candles.map(c => Number(c.close));
      const price = closes[closes.length - 1];
      const openPrice = Number(candles[candles.length - 1].open);

      const changePct = (((price - openPrice) / openPrice) * 100).toFixed(2);
      const rsi = calculateRSI(closes, 14);
      const ema50 = calculateEMA(closes, 50);

      let s = state[m.symbol];
      s.price = price;
      s.m15ChangePct = changePct;
      s.rsi = rsi;
      s.ema50 = ema50;

      if (price > ema50 && rsi <= 42) s.signal = "BUY";
      else if (price < ema50 && rsi >= 58) s.signal = "SELL";
      else s.signal = "WAIT";
    }

    function render() {
      const container = document.getElementById("card-container");
      container.innerHTML = MARKETS.map(m => {
        let s = state[m.symbol];
        let cardClass = s.signal === "BUY" ? "buy" : (s.signal === "SELL" ? "sell" : "");
        let pillClass = s.signal === "BUY" ? "pill-buy" : (s.signal === "SELL" ? "pill-sell" : "pill-wait");
        let pctClass = Number(s.m15ChangePct) >= 0 ? "up" : "down";

        return `
          <div class="card ${cardClass}">
            <div class="card-head">
              <span class="symbol-title">${m.name}</span>
              <span class="signal-pill ${pillClass}">M15 ${s.signal}</span>
            </div>

            <div class="data-grid">
              <span>Price: <b>${s.price ? s.price.toFixed(m.digits) : 'Syncing...'}</b></span>
              <span>M15 Shift: <b class="${pctClass}">${s.m15ChangePct}%</b></span>
              <span>RSI (14): <b>${s.rsi}</b></span>
              <span>50 EMA: <b>${s.ema50 ? s.ema50.toFixed(m.digits) : '...'}</b></span>
              <span style="grid-column: span 2;">Live Ticks Streamed: <b>${s.ticks}</b></span>
            </div>
          </div>
        `;
      }).join('');
    }

    function connect() {
      if (ws) ws.close();

      const tag = document.getElementById("status-tag");
      const text = document.getElementById("status-text");

      tag.className = "status-badge";
      text.innerText = "CONNECTING...";
      printLog("Connecting to WebSocket server...");

      ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

      ws.onopen = () => {
        tag.className = "status-badge online";
        text.innerText = "STREAM LIVE";
        printLog("Connected! Subscribing to market channels...");

        // Queue-based subscription logic (300ms delay per market to respect rate limits)
        MARKETS.forEach((m, index) => {
          setTimeout(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
              // Subscribe directly to live ticks
              ws.send(JSON.stringify({ ticks: m.symbol }));
              
              // Request M15 historical candles
              ws.send(JSON.stringify({
                ticks_history: m.symbol,
                adjust_start_time: 1,
                count: 50,
                end: "latest",
                granularity: 900,
                style: "candles"
              }));
              printLog(`Subscribed: ${m.name}`);
            }
          }, index * 300);
        });
      };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.msg_type === "candles") {
          const symbol = data.echo_req.ticks_history;
          if (state[symbol]) {
            state[symbol].candles = data.candles;
            const m = MARKETS.find(x => x.symbol === symbol);
            if (m) analyze(m, state[symbol].candles);
            render();
          }
        }

        if (data.msg_type === "tick") {
          ticksReceived++;
          const symbol = data.tick.symbol;
          const price = Number(data.tick.quote);

          if (state[symbol]) {
            state[symbol].price = price;
            state[symbol].ticks++;

            if (state[symbol].candles.length > 0) {
              let lastCandle = state[symbol].candles[state[symbol].candles.length - 1];
              lastCandle.close = price;
              if (price > Number(lastCandle.high)) lastCandle.high = price;
              if (price < Number(lastCandle.low)) lastCandle.low = price;

              const m = MARKETS.find(x => x.symbol === symbol);
              if (m) analyze(m, state[symbol].candles);
            }
            render();
          }
        }
      };

      ws.onerror = (err) => {
        tag.className = "status-badge error";
        text.innerText = "ERROR";
        printLog("Socket connection error encountered.");
      };

      ws.onclose = () => {
        tag.className = "status-badge";
        text.innerText = "DISCONNECTED";
        printLog("Connection closed.");
      };
    }

    function reconnect() {
      connect();
    }

    render();
    connect();
  </script>
</body>
</html>
