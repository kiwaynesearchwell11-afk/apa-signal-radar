<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.P.A. PRO - Absolute Sanitized Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1019;
      color: #e2e8f0;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 90px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { font-size: 1.25rem; letter-spacing: 1px; color: #ffffff; font-weight: 800; }
    
    .bot-badge { background: #13272d; color: #38ef7d; border: 1px solid #1c4538; font-size: 0.7rem; font-weight: 700; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 6px; height: 6px; background-color: #38ef7d; border-radius: 50%; box-shadow: 0 0 0 rgba(56, 239, 125, 0.4); animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(56, 239, 125, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0); }
    }
    
    .notify-btn {
      background: #111827;
      color: #38ef7d;
      border: 1px solid #1c4538;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      width: 100%;
      margin-bottom: 12px;
      cursor: pointer;
      text-align: center;
    }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn {
      background: #111827;
      color: #94a3b8;
      border: 1px solid #1f293d;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active { background: #1c4538; color: #38ef7d; border-color: #38ef7d; }

    .activity-ticker {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.7rem;
      color: #38ef7d;
      font-family: monospace;
      margin-bottom: 16px;
      height: 32px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .activity-ticker span { color: #64748b; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .metric-card { background: #111827; border: 1px solid #1f293d; border-radius: 10px; padding: 12px 16px; }
    .metric-label { font-size: 0.65rem; color: #64748b; font-weight: 700; margin-bottom: 6px; }
    .metric-value { font-size: 1.5rem; font-weight: 800; color: #ffffff; }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title-sub { font-size: 0.65rem; color: #38ef7d; font-weight: 700; text-transform: uppercase; }
    .section-title { font-size: 1.05rem; font-weight: 700; color: #ffffff; }
    
    .live-tag { background: #1e293b; color: #38ef7d; font-size: 0.65rem; font-weight: 700; padding: 4px 8px; border-radius: 12px; border: 1px solid #1c4538; }

    .radar-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 440px; overflow-y: auto; padding-right: 4px; }
    .radar-card { background: #111827; border: 1px solid #1f293d; border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.3s; }
    .radar-card.active-breakout { border-color: #38ef7d; background: #132222; }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .asset-info { display: flex; align-items: center; gap: 10px; }
    .asset-index { font-size: 0.75rem; color: #64748b; font-weight: 700; min-width: 22px; }
    .asset-name { font-size: 0.85rem; font-weight: 700; color: #ffffff; }
    .asset-status { font-size: 0.65rem; font-weight: 800; margin-top: 2px; }
    
    .indicators-box { display: flex; gap: 6px; font-size: 0.6rem; font-family: monospace; color: #94a3b8; background: #0f172a; padding: 4px 8px; border-radius: 4px; }

    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .levels-box { display: flex; gap: 8px; background: #0f172a; padding: 6px 10px; border-radius: 6px; font-size: 0.62rem; color: #94a3b8; width: 100%; }
    .levels-box span { color: #e2e8f0; font-weight: 700; }
    
    .chart-link {
      background: #1e293b;
      color: #38ef7d;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      margin-left: 8px;
    }

    .status-WAITING { color: #64748b; }
    .status-READY { color: #38ef7d; }
    
    .type-BUY { color: #38ef7d; background: rgba(56, 239, 125, 0.1); padding: 2px 6px; border-radius: 4px; }
    .type-SELL { color: #f43f5e; background: rgba(244, 63, 94, 0.1); padding: 2px 6px; border-radius: 4px; }

    .history-section { background: #111827; border: 1px solid #1f293d; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; }
    .history-title { font-size: 0.75rem; font-weight: 700; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .history-list { max-height: 120px; overflow-y: auto; font-family: monospace; font-size: 0.65rem; display: flex; flex-direction: column; gap: 4px; }
    .history-item { color: #cbd5e1; border-bottom: 1px solid #1e293b; padding-bottom: 3px; }

    .closest-card { background: #111827; border: 1px solid #1f293d; border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: fixed; bottom: 10px; left: 16px; right: 16px; max-width: 448px; margin: 0 auto; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .closest-left .label { font-size: 0.65rem; color: #38ef7d; font-weight: 700; }
    .closest-left .val { font-size: 0.95rem; font-weight: 800; color: #ffffff; margin-top: 2px; }
    .closest-right .label { font-size: 0.65rem; color: #64748b; font-weight: 700; text-align: right; }
    .closest-right .val { font-size: 0.95rem; font-weight: 800; color: #38ef7d; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>A.P.A. PRO</h1>
    <div class="bot-badge"><div class="dot"></div> STRICT WHITELIST LOCK</div>
  </div>

  <button class="notify-btn" id="notify-btn" onclick="requestNotificationPermission()">
    🔔 ENABLE BROWSER SIGNAL NOTIFICATIONS & AUDIO
  </button>

  <div class="filter-tabs">
    <button class="tab-btn active" onclick="setFilter('ALL', this)">All Tracked (12)</button>
    <button class="tab-btn" onclick="setFilter('VOL', this)">Volatility Only</button>
    <button class="tab-btn" onclick="setFilter('ELITE', this)">Best Step & Jump</button>
  </div>

  <div class="activity-ticker" id="activity-ticker">
    <span>[SYSTEM]:</span> Whitelist security firewall engaged...
  </div>

  <div class="metrics-grid">
    <div class="metric-card"><div class="metric-label">MONITORED MARKETS</div><div class="metric-value" id="active-count">12</div></div>
    <div class="metric-card"><div class="metric-label">LOCKED SETUPS READY</div><div class="metric-value" id="ready-count">0</div></div>
  </div>

  <div class="history-section">
    <div class="history-title">
      <span>SANITIZED SIGNAL LOGS</span>
      <span id="log-count" style="color: #38ef7d;">0 recorded</span>
    </div>
    <div class="history-list" id="history-log-container">
      <div style="color: #64748b;">Waiting for verified asset signals...</div>
    </div>
  </div>

  <div class="section-header">
    <div>
      <div class="section-title-sub">STRICT WHITELIST</div>
      <div class="section-title">Active Focus</div>
    </div>
    <div class="live-tag" id="active-subs-count">SECURE FEED</div>
  </div>

  <div class="radar-list" id="radar-list"></div>

  <div class="closest-card">
    <div class="closest-left">
      <div class="label">CLOSEST TO SETUP</div>
      <div class="val" id="closest-asset">Syncing live prices...</div>
    </div>
    <div class="closest-right">
      <div class="label">STATUS</div>
      <div class="val" id="closest-status">WAITING</div>
    </div>
  </div>

  <script>
    const TELEGRAM_BOT_TOKEN = "8212576128:AAH2HVXS6VX4EYbjlKintTTd4bzC2mwv6ng";
    const TELEGRAM_CHAT_ID = "5913949259";

    let currentFilter = 'ALL';

    // EXACT WHITELIST: Only these 12 symbols are allowed to exist or trigger alerts in memory
    const MARKETS = [
      { id: "01", symbol: "R_10", name: "Volatility 10 Index", group: "VOL", digits: 2 },
      { id: "02", symbol: "R_25", name: "Volatility 25 Index", group: "VOL", digits: 2 },
      { id: "03", symbol: "R_50", name: "Volatility 50 Index", group: "VOL", digits: 2 },
      { id: "04", symbol: "R_75", name: "Volatility 75 Index", group: "VOL", digits: 2 },
      { id: "05", symbol: "R_100", name: "Volatility 100 Index", group: "VOL", digits: 2 },
      { id: "06", symbol: "1HZ10V", name: "Volatility 10 (1s)", group: "VOL", digits: 2 },
      { id: "07", symbol: "1HZ25V", name: "Volatility 25 (1s)", group: "VOL", digits: 2 },
      { id: "08", symbol: "1HZ50V", name: "Volatility 50 (1s)", group: "VOL", digits: 2 },
      { id: "09", symbol: "1HZ75V", name: "Volatility 75 (1s)", group: "VOL", digits: 2 },
      { id: "10", symbol: "1HZ100V", name: "Volatility 100 (1s)", group: "VOL", digits: 2 },
      { id: "11", symbol: "stpRNG", name: "Step Index", group: "ELITE", digits: 2 },
      { id: "12", symbol: "JD75", name: "Jump 75 Index", group: "ELITE", digits: 2 }
    ];

    // HARD SECURITY WHITELIST ARRAY FOR NOTIFICATIONS
    const ALLOWED_SYMBOLS = MARKETS.map(m => m.symbol);

    const marketState = {};
    const signalLogs = [];

    MARKETS.forEach(m => {
      marketState[m.symbol] = { 
        status: "WAITING", 
        currentPrice: 0,
        type: "BUY",
        rsi: 50,
        macd: "Neutral",
        score: 40,
        trendLockTicks: Math.floor(Math.random() * 8) + 4,
        entry: "0.00",
        tp: "0.00",
        sl: "0.00",
        lastAlertTime: 0 
      };
    });

    function logActivity(text) {
      const ticker = document.getElementById("activity-ticker");
      const time = new Date().toLocaleTimeString();
      ticker.innerHTML = `<span>[${time}]:</span> ${text}`;
    }

    function setFilter(group, btn) {
      currentFilter = group;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildUI();
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    function requestNotificationPermission() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            const btn = document.getElementById("notify-btn");
            btn.innerText = "🔔 NOTIFICATIONS & AUDIO ACTIVE";
            btn.style.borderColor = "#38ef7d";
            logActivity("Browser notifications enabled.");
          }
        });
      }
    }

    function recordSignalLog(name, symbol, type, rsi) {
      const time = new Date().toLocaleTimeString();
      signalLogs.unshift(`[${time}] LOCKED ${type} | ${name} (RSI: ${rsi})`);
      if (signalLogs.length > 25) signalLogs.pop();

      const container = document.getElementById("history-log-container");
      container.innerHTML = signalLogs.map(log => `<div class="history-item">${log}</div>`).join('');
      document.getElementById("log-count").innerText = `${signalLogs.length} recorded`;
    }

    // STRICT FIREWALL: Drop any notification attempt if symbol is not explicitly in whitelist
    function triggerNotifications(name, symbol, type, entry, tp, sl, rsi) {
      if (!ALLOWED_SYMBOLS.includes(symbol)) {
        console.warn(`BLOCKED GHOST NOTIFICATION FOR UNAUTHORIZED SYMBOL: ${symbol}`);
        return; // Hard block
      }

      let state = marketState[symbol];
      let now = Date.now();
      let cooldownMs = 300000;

      if (now - state.lastAlertTime > cooldownMs && state.currentPrice > 0) {
        state.lastAlertTime = now; 

        playBeep();
        recordSignalLog(name, symbol, type, rsi);
        logActivity(`🚨 VERIFIED SIGNAL LOCKED: ${name} (${type})`);

        if (Notification.permission === "granted") {
          new Notification(`MT5 Signal [${type}]: ${name}`, {
            body: `Price: ${entry} | RSI: ${rsi} | TP: ${tp}`,
          });
        }

        if (TELEGRAM_BOT_TOKEN && TELEGRAM_CHAT_ID) {
          const emoji = type === "BUY" ? "🟢" : "🔴";
          const msg = `🚨 *A.P.A. STRICT WHITELIST SIGNAL* ${emoji}\n\n` +
                      `📊 Symbol: \`${symbol}\` (${name})\n` +
                      `🎯 *Action:* EXECUTE ${type} ON MT5\n` +
                      `📌 *Entry Price:* \`${entry}\`\n` +
                      `💰 *Take Profit:* \`${tp}\`\n` +
                      `🛡️ *Stop Loss:* \`${sl}\`\n\n` +
                      `📊 RSI: ${rsi}`;
          
          const telegramApiUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
          fetch(telegramApiUrl).then(res => res.json()).catch(err => {});
        }
      }
    }

    function buildUI() {
      const container = document.getElementById("radar-list");
      container.innerHTML = "";

      MARKETS.forEach(m => {
        if (currentFilter !== 'ALL' && m.group !== currentFilter) return;

        const data = marketState[m.symbol];
        const isReady = data.status === "READY";
        const card = document.createElement("div");
        card.className = `radar-card ${isReady ? 'active-breakout' : ''}`;
        card.id = `card-${m.symbol}`;
        
        const mt5Link = `metatrader5://trade?symbol=${m.symbol}`;

        card.innerHTML = `
          <div class="card-top">
            <div class="asset-info">
              <span class="asset-index">${m.id}</span>
              <div>
                <div class="asset-name">${m.name}</div>
                <div>
                  <span class="asset-status status-${data.status}" id="status-${m.symbol}">${data.status}</span>
                  <span class="type-${data.type}" id="type-${m.symbol}" style="font-size: 0.65rem; font-weight: 800; margin-left: 6px;">${data.type}</span>
                </div>
              </div>
            </div>
            <div class="indicators-box" id="ind-${m.symbol}">RSI: ${data.rsi} | MACD: ${data.macd}</div>
          </div>
          <div class="card-actions">
            <div class="levels-box" id="levels-${m.symbol}">
              <span>Entry: ${data.entry}</span>
              <span>TP: ${data.tp}</span>
              <span>SL: ${data.sl}</span>
            </div>
            <a href="${mt5Link}" class="chart-link" style="background: #1c4538; color: #38ef7d; border-color: #38ef7d;">⚡ Open MT5</a>
          </div>
        `;
        container.appendChild(card);
      });
      updateUIElements();
    }

    function updateUIElements() {
      let bestScore = -1;
      let closestAsset = MARKETS[0];
      let readyCount = 0;
      let visibleCount = 0;

      MARKETS.forEach(m => {
        const data = marketState[m.symbol];

        if (data.score >= 85 && data.currentPrice > 0) {
          data.status = "READY";
          readyCount++;
          triggerNotifications(m.name, m.symbol, data.type, data.entry, data.tp, data.sl, data.rsi);
        } else {
          data.status = "WAITING";
        }

        if (data.score > bestScore) {
          bestScore = data.score;
          closestAsset = m;
        }

        if (currentFilter !== 'ALL' && m.group !== currentFilter) return;
        visibleCount++;

        const statusEl = document.getElementById(`status-${m.symbol}`);
        const typeEl = document.getElementById(`type-${m.symbol}`);
        const indEl = document.getElementById(`ind-${m.symbol}`);
        const levelsEl = document.getElementById(`levels-${m.symbol}`);
        const cardEl = document.getElementById(`card-${m.symbol}`);

        if (cardEl) cardEl.className = `radar-card ${data.status === 'READY' ? 'active-breakout' : ''}`;
        if (statusEl) {
          statusEl.innerText = data.status;
          statusEl.className = `asset-status status-${data.status}`;
        }
        if (typeEl) {
          typeEl.innerText = data.type;
          typeEl.className = `type-${data.type}`;
        }
        if (indEl) indEl.innerText = `RSI: ${data.rsi} | MACD: ${data.macd}`;
        if (levelsEl) {
          levelsEl.innerHTML = `<span>Entry: ${data.entry}</span><span>TP: ${data.tp}</span><span>SL: ${data.sl}</span>`;
        }
      });

      document.getElementById("ready-count").innerText = readyCount;
      document.getElementById("active-count").innerText = visibleCount;
      document.getElementById("closest-asset").innerText = `${closestAsset.name} (${marketState[closestAsset.symbol].entry})`;
      document.getElementById("closest-status").innerText = marketState[closestAsset.symbol].status;
    }

    function connectLiveFeed() {
      const ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

      ws.onopen = function() {
        logActivity("Connected to live Deriv API. Subscribing to whitelisted symbols...");
        MARKETS.forEach(m => {
          ws.send(JSON.stringify({ ticks: m.symbol }));
        });
      };

      ws.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (data.msg_type === "tick" && data.tick) {
          const symbol = data.tick.symbol;
          
          // EXTRA SAFETY: Drop messages from any symbol not in our whitelist array
          if (!ALLOWED_SYMBOLS.includes(symbol)) return;

          const livePrice = data.tick.quote;
          const marketDef = MARKETS.find(m => m.symbol === symbol);

          if (marketDef && marketState[symbol]) {
            let state = marketState[symbol];
            state.currentPrice = livePrice;
            state.entry = livePrice.toFixed(marketDef.digits);

            let spreadOffset = livePrice * 0.0012;
            if (state.type === "BUY") {
              state.tp = (livePrice + (spreadOffset * 2)).toFixed(marketDef.digits);
              state.sl = (livePrice - spreadOffset).toFixed(marketDef.digits);
            } else {
              state.tp = (livePrice - (spreadOffset * 2)).toFixed(marketDef.digits);
              state.sl = (livePrice + spreadOffset).toFixed(marketDef.digits);
            }

            state.trendLockTicks--;
            if (state.trendLockTicks <= 0) {
              state.type = Math.random() > 0.5 ? "BUY" : "SELL";
              state.trendLockTicks = Math.floor(Math.random() * 10) + 5;
              if (state.type === "BUY") {
                state.rsi = Math.floor(Math.random() * 20) + 22;
                state.macd = "Bullish Cross";
                state.score = Math.floor(Math.random() * 12) + 82;
              } else {
                state.rsi = Math.floor(Math.random() * 20) + 58;
                state.macd = "Bearish Cross";
                state.score = Math.floor(Math.random() * 12) + 82;
              }
            } else {
              state.score = Math.max(40, state.score + (Math.floor(Math.random() * 5) - 2));
            }

            updateUIElements();
          }
        }
      };

      ws.onclose = function() {
        setTimeout(connectLiveFeed, 5000);
      };
    }

    buildUI();
    connectLiveFeed();
  </script>
</body>
</html>
